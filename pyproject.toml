[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "kn-event-horizon"
version = "0.1.0"
description = "A domain knowledge aggregator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Project Contributors" }]
keywords = ["knowledge-aggregation", "domain-knowledge", "provenance", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "alembic>=1.17,<2",
  "babel>=2.17,<3",
  "jsonschema>=4.25,<5",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.12,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0.44,<3",
]

[project.optional-dependencies]
dev = [
  "complexipy==6.0.0",
  "mypy>=1.15,<2",
  "psycopg[binary]>=3.3,<4",
  "pymarkdownlnt>=0.9.32,<1",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "types-pyyaml>=6,<7",
  "radon==6.0.1",
  "ruff>=0.11,<0.17",
  "shellcheck-py==0.11.0.1",
  "types-jsonschema>=4.25,<5",
  "fastavro>=1.12,<2",
]

[dependency-groups]
contract-tools = ["datacontract-cli==1.2.11"]

[tool.uv.dependency-groups]
contract-tools = { requires-python = ">=3.12,<3.15" }

[project.scripts]
kn = "kn.cli:main"
kn-plan = "kn.quality.plan_summary:main"

[project.urls]
Homepage = "https://github.com/volod/kn-event-horizon"
Documentation = "https://github.com/volod/kn-event-horizon/tree/main/docs"
Repository = "https://github.com/volod/kn-event-horizon"
Issues = "https://github.com/volod/kn-event-horizon/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kn.contracts" = ["resources/**/*.json"]
"kn.i18n.locales" = ["*/*.json"]
"kn.semantic" = ["resources/*.json"]
"kn.db" = ["migrations/*.py", "migrations/versions/*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/kn"]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rfEs --strict-markers"

[tool.coverage.run]
branch = true
source = ["kn"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
]

[tool.pymarkdown]
extensions.markdown-tables.enabled = true
plugins.MD013.line_length = 100
plugins.MD013.code_block_line_length = 100
plugins.MD013.heading_line_length = 100
plugins.MD013.tables = false
plugins.MD022.enabled = false
plugins.MD024.enabled = false
plugins.MD032.enabled = false
plugins.MD040.enabled = false
